<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Research loop from paper reading to knowledge reuse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07111f"/><stop offset="55%" stop-color="#0b1526"/><stop offset="100%" stop-color="#10172a"/></linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="70%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#94a3b8" opacity="0.075"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#020617" flood-opacity="0.4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/></marker>
  </defs>
  <rect width="1200" height="500" rx="22" fill="url(#bg)"/><rect width="1200" height="500" rx="22" fill="url(#dots)"/><rect width="1200" height="500" rx="22" fill="url(#glow)"/><rect x="1" y="1" width="1198" height="498" rx="21" fill="none" stroke="#334155" stroke-opacity="0.55"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><text x="600" y="50" text-anchor="middle" font-size="27" font-weight="740" fill="#f8fafc">The Research Knowledge Loop</text><text x="600" y="79" text-anchor="middle" font-size="14.5" fill="#94a3b8">Preserve each paper's evidence, then connect, synthesize, and update knowledge across papers</text></g>
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"><path d="M 282 232 L 334 232"/><path d="M 574 232 L 626 232"/><path d="M 866 232 L 918 232"/></g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" filter="url(#shadow)">
    <g><rect x="42" y="120" width="240" height="220" rx="17" fill="#101d2e" stroke="#334155"/><circle cx="67" cy="145" r="14" fill="#1e293b" stroke="#64748b"/><text x="67" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#cbd5e1">1</text><g fill="none" stroke="#cbd5e1" stroke-width="1.8"><rect x="140" y="153" width="43" height="54" rx="5"/><path d="M 150 167 H 173 M 150 177 H 173 M 150 187 H 167"/><path d="M 133 162 H 126 Q 120 162 120 168 V 211 Q 120 217 126 217 H 159" stroke="#475569"/></g><text x="162" y="247" text-anchor="middle" font-size="18" font-weight="720" fill="#f8fafc">New papers</text><text x="162" y="273" text-anchor="middle" font-size="13" fill="#94a3b8">PDF or source map</text><text x="162" y="296" text-anchor="middle" font-size="13" fill="#94a3b8">Source files stay read-only</text><rect x="99" y="314" width="126" height="25" rx="12.5" fill="#1e293b"/><text x="162" y="331" text-anchor="middle" font-size="11" fill="#cbd5e1">Enter the collection</text></g>
    <g><rect x="334" y="120" width="240" height="220" rx="17" fill="#0f2331" stroke="#2dd4bf" stroke-opacity="0.56"/><circle cx="359" cy="145" r="14" fill="#0f766e" fill-opacity="0.38" stroke="#2dd4bf"/><text x="359" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#99f6e4">2</text><g fill="none" stroke="#5eead4" stroke-width="1.9"><rect x="429" y="153" width="49" height="58" rx="6"/><path d="M 439 168 H 468 M 439 179 H 468 M 439 190 H 457"/><circle cx="468" cy="198" r="4" fill="#2dd4bf" stroke="none"/></g><text x="454" y="247" text-anchor="middle" font-size="18" font-weight="720" fill="#f8fafc">Paper Card</text><text x="454" y="273" text-anchor="middle" font-size="13" fill="#94a3b8">Preserve the full argument</text><text x="454" y="296" text-anchor="middle" font-size="13" fill="#94a3b8">Anchor claims to the source</text><rect x="388" y="314" width="132" height="25" rx="12.5" fill="#0f766e" fill-opacity="0.26"/><text x="454" y="331" text-anchor="middle" font-size="11" fill="#99f6e4">Read and verify</text></g>
    <g><rect x="626" y="120" width="240" height="220" rx="17" fill="#171d38" stroke="#818cf8" stroke-opacity="0.6"/><circle cx="651" cy="145" r="14" fill="#4338ca" fill-opacity="0.34" stroke="#818cf8"/><text x="651" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#c7d2fe">3</text><g fill="none" stroke="#a5b4fc" stroke-width="1.8"><path d="M 712 210 V 159 H 781 V 210"/><path d="M 721 174 H 771 M 721 187 H 754 M 721 200 H 765"/><circle cx="770" cy="187" r="3.5" fill="#818cf8" stroke="none"/></g><text x="746" y="247" text-anchor="middle" font-size="18" font-weight="720" fill="#f8fafc">Topic</text><text x="746" y="273" text-anchor="middle" font-size="13" fill="#94a3b8">Compare methods and results</text><text x="746" y="296" text-anchor="middle" font-size="13" fill="#94a3b8">Keep consensus and gaps</text><rect x="677" y="314" width="138" height="25" rx="12.5" fill="#4338ca" fill-opacity="0.25"/><text x="746" y="331" text-anchor="middle" font-size="11" fill="#c7d2fe">Synthesize papers</text></g>
    <g><rect x="918" y="120" width="240" height="220" rx="17" fill="#1d1b37" stroke="#a78bfa" stroke-opacity="0.62"/><circle cx="943" cy="145" r="14" fill="#7e22ce" fill-opacity="0.3" stroke="#a78bfa"/><text x="943" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#e9d5ff">4</text><g fill="none" stroke="#c4b5fd" stroke-width="1.8"><rect x="1010" y="155" width="56" height="54" rx="7"/><path d="M 1020 168 H 1056 M 1020 180 H 1040 M 1020 192 H 1050"/><circle cx="1056" cy="180" r="3.5" fill="#a78bfa" stroke="none"/></g><text x="1038" y="247" text-anchor="middle" font-size="18" font-weight="720" fill="#f8fafc">Research Wiki</text><text x="1038" y="273" text-anchor="middle" font-size="12.5" fill="#94a3b8">Index · dashboard · tree · log</text><text x="1038" y="296" text-anchor="middle" font-size="13" fill="#94a3b8">Retrieve · verify · compare · reuse</text><rect x="970" y="314" width="136" height="25" rx="12.5" fill="#7e22ce" fill-opacity="0.23"/><text x="1038" y="331" text-anchor="middle" font-size="11" fill="#e9d5ff">Support ongoing work</text></g>
  </g>
  <path d="M 1038 361 V 406 Q 1038 428 1016 428 H 189 Q 162 428 162 401 V 354" fill="none" stroke="url(#loop)" stroke-width="2.5" stroke-linecap="round" marker-end="url(#loopArrow)"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"><rect x="330" y="401" width="540" height="54" rx="27" fill="#0d1b2d" stroke="#475569"/><circle cx="356" cy="428" r="5" fill="#2dd4bf"/><text x="600" y="424" text-anchor="middle" font-size="13.5" font-weight="650" fill="#e2e8f0">Open questions and research gaps guide the next reading cycle</text><text x="600" y="443" text-anchor="middle" font-size="11" fill="#64748b">wiki-gap-mining · new evidence extends, revises, or challenges knowledge</text></g>
</svg>
