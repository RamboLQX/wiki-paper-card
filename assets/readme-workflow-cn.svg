<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="从论文阅读到研究知识复用的持续流程">
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1d1d1f" flood-opacity="0.08"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#0071e3"/></marker>
  </defs>
  <rect width="1200" height="440" rx="28" fill="#f5f5f7"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="600" y="56" text-anchor="middle" font-size="28" font-weight="700" fill="#1d1d1f">从读过一篇论文，到建立一个研究方向</text>
    <text x="600" y="86" text-anchor="middle" font-size="15" fill="#6e6e73">新论文持续补充、验证或挑战已有知识</text>
    <g filter="url(#shadow)"><rect x="60" y="120" width="1080" height="214" rx="22" fill="#fff" stroke="#d2d2d7"/></g>
    <path d="M330 120V334M600 120V334M870 120V334" stroke="#e5e5ea"/>
    <g text-anchor="middle">
      <circle cx="195" cy="175" r="27" fill="#e8f2ff"/><path d="M184 159h17l7 7v25h-24zM201 159v8h7M190 174h12M190 181h12" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="195" y="232" font-size="19" font-weight="650" fill="#1d1d1f">放入论文</text><text x="195" y="260" font-size="14" fill="#6e6e73">保留 PDF 与原始资料</text><text x="195" y="284" font-size="14" fill="#6e6e73">从一次阅读开始积累</text>
      <circle cx="465" cy="175" r="27" fill="#e8f2ff"/><path d="M452 158h26v34h-26zM458 168h14M458 176h14M458 184h9" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="465" y="232" font-size="19" font-weight="650" fill="#1d1d1f">建立 Paper Card</text><text x="465" y="260" font-size="14" fill="#6e6e73">恢复论文完整上下文</text><text x="465" y="284" font-size="14" fill="#6e6e73">结论可回到原文核验</text>
      <circle cx="735" cy="175" r="27" fill="#e8f2ff"/><path d="M722 168h8v8h-8zM740 158h8v8h-8zM740 184h8v8h-8zM730 172l10-10M730 174l10 14" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="735" y="232" font-size="19" font-weight="650" fill="#1d1d1f">形成 Topic</text><text x="735" y="260" font-size="14" fill="#6e6e73">比较方法、证据与边界</text><text x="735" y="284" font-size="14" fill="#6e6e73">沉淀共识、分歧与空白</text>
      <circle cx="1005" cy="175" r="27" fill="#e8f2ff"/><path d="M991 164h28v24h-28zM996 171h18M996 178h11" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1005" y="232" font-size="19" font-weight="650" fill="#1d1d1f">复用研究知识</text><text x="1005" y="260" font-size="14" fill="#6e6e73">检索、综述、查证与选题</text><text x="1005" y="284" font-size="14" fill="#6e6e73">沿开放问题继续阅读</text>
    </g>
    <path d="M1005 352v22c0 16-13 29-29 29H224c-16 0-29-13-29-29v-20" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="430" y="376" width="340" height="42" rx="21" fill="#fff" stroke="#d2d2d7"/><text x="600" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#1d1d1f">研究空白与开放问题，组织下一轮阅读</text>
  </g>
</svg>
